openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Machinedog Client Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: prompts
    description: AI prompt submissions
  - name: tokens
    description: Token balance and purchases
  - name: projects
    description: Client projects
  - name: consulting
    description: Consulting packages and bookings
  - name: admin
    description: Admin operations
  - name: leads
    description: Public lead capture (e.g. pricing-page contact form)
  - name: checkout
    description: Public Stripe Checkout entry points (no auth)
  - name: storage
    description: Object storage upload and serving endpoints
  - name: templates
    description: Project starter templates

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Client self-service ───────────────────────────────────────────────────

  /clients/me:
    get:
      operationId: getMe
      tags: [clients]
      summary: Get my client profile
      responses:
        "200":
          description: Client profile with token balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          description: Unauthorized

  # ─── Prompts ───────────────────────────────────────────────────────────────

  /prompts:
    get:
      operationId: listMyPrompts
      tags: [prompts]
      summary: List my prompt sessions
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of prompt sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSessionList"
    post:
      operationId: submitPrompt
      tags: [prompts]
      summary: Submit a prompt (deducts tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPromptBody"
      responses:
        "200":
          description: Prompt result with token usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSession"
        "402":
          description: Insufficient token balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /prompts/{id}:
    get:
      operationId: getPrompt
      tags: [prompts]
      summary: Get a specific prompt session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prompt session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSession"
        "404":
          description: Not found

  /prompts/{id}/publish:
    post:
      operationId: publishPrompt
      tags: [prompts]
      summary: Mark a prompt session as published (or unpublished)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPromptBody"
      responses:
        "200":
          description: Updated prompt session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSession"
        "404":
          description: Not found

  # ─── Tokens ────────────────────────────────────────────────────────────────

  /tokens/bundles:
    get:
      operationId: listTokenBundles
      tags: [tokens]
      summary: List available token bundles for purchase
      responses:
        "200":
          description: Token bundles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBundleList"

  /tokens/purchases:
    get:
      operationId: listMyTokenPurchases
      tags: [tokens]
      summary: List my token purchase history
      responses:
        "200":
          description: Purchase history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPurchaseList"

  /tokens/checkout:
    post:
      operationId: createTokenCheckout
      tags: [tokens]
      summary: Create a Stripe Checkout session for token bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  # ─── Templates ─────────────────────────────────────────────────────────────

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List project starter templates
      parameters:
        - in: query
          name: category
          schema:
            type: string
            enum: [general, healthcare]
      responses:
        "200":
          description: Templates list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"

  # ─── Projects ──────────────────────────────────────────────────────────────

  /projects:
    get:
      operationId: listMyProjects
      tags: [projects]
      summary: List my projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/heartbeat:
    post:
      operationId: projectHeartbeat
      tags: [projects]
      summary: Auto-report a Replit dev URL from a client app
      description: >-
        Public endpoint hit by the heartbeat snippet installed in the client
        app. Auth is by per-project token (in the body) — no session required,
        so it works from anywhere the snippet is loaded. Updates the project's
        liveUrl and heartbeatAt timestamp. Idempotent.
      security: []  # public; auth is the token in the body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectHeartbeatBody"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHeartbeatResponse"
        "401":
          description: Unknown or rotated token
        "400":
          description: Invalid body

  /projects/prod-heartbeat:
    post:
      operationId: projectProdHeartbeat
      tags: [projects]
      summary: Auto-report a production boot from a deployed client app
      description: >-
        Public endpoint hit by the same heartbeat snippet running on the
        deployed (production) app — i.e. when REPLIT_DEV_DOMAIN is unset.
        Auth is by per-project token in the body. Records the production
        boot and, when a fresh boot is observed at least the configured
        grace period after a change request was merged, automatically
        flips that change request from `awaiting_deploy` to `deployed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectProdHeartbeatBody"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProdHeartbeatResponse"
        "401":
          description: Unknown or rotated token
        "400":
          description: Invalid body

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}/members:
    get:
      operationId: listProjectMembers
      tags: [projects]
      summary: List members on a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberList"
    post:
      operationId: inviteProjectMember
      tags: [projects]
      summary: Invite a client to a project by email
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteProjectMemberBody"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"

  /projects/{id}/members/{memberId}:
    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: Remove a member from a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: memberId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Member removed

  /projects/{id}/comments:
    get:
      operationId: listProjectComments
      tags: [projects]
      summary: List comments on a project (owner or member)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCommentList"
    post:
      operationId: addProjectComment
      tags: [projects]
      summary: Post a comment on a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectCommentBody"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectComment"

  /projects/{id}/comments/{commentId}:
    delete:
      operationId: deleteProjectComment
      tags: [projects]
      summary: Delete a comment (author or project owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: commentId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted

  /projects/{id}/prompts:
    get:
      operationId: listProjectPrompts
      tags: [projects]
      summary: List prompt sessions scoped to this project (shared across members)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSessionList"
    post:
      operationId: submitProjectPrompt
      tags: [projects]
      summary: Submit a prompt scoped to this project (charges submitter tokens)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPromptBody"
      responses:
        "200":
          description: Prompt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSession"

  /projects/{id}/files:
    get:
      operationId: listProjectFiles
      tags: [projects]
      summary: List files attached to this project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileList"
    post:
      operationId: addProjectFile
      tags: [projects]
      summary: Record an uploaded file's metadata against a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectFileBody"
      responses:
        "201":
          description: Created file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"

  /projects/{id}/files/{fileId}:
    delete:
      operationId: deleteProjectFile
      tags: [projects]
      summary: Remove a file from a project (uploader or project owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: fileId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: File removed

  # ─── Change requests ───────────────────────────────────────────────────────

  /projects/{id}/change-requests:
    get:
      operationId: listProjectChangeRequests
      tags: [change-requests]
      summary: List change requests for a project (owner or member)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Change requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestList"
    post:
      operationId: createChangeRequest
      tags: [change-requests]
      summary: Submit a new plain-English change request against a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /projects/{id}/change-requests/agent:
    post:
      operationId: submitAgentChangeRequest
      tags: [change-requests]
      summary: Submit a request and immediately kick off the full agent pipeline (distill + patch) in the background
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeRequestBody"
      responses:
        "201":
          description: Created and pipeline started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /projects/{id}/agent-thread:
    get:
      operationId: getProjectAgentThread
      tags: [change-requests]
      summary: Get all change requests for a project plus their events, ordered for chat-style rendering
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unified thread payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentThreadResponse"

  /change-requests/{id}:
    get:
      operationId: getChangeRequest
      tags: [change-requests]
      summary: Get a change request with its event timeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Change request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestDetail"

  /change-requests/{id}/distill:
    post:
      operationId: distillChangeRequest
      tags: [change-requests]
      summary: Use Claude to turn the raw request into a structured spec
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Distilled spec attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /change-requests/{id}/generate-patch:
    post:
      operationId: generateChangePatch
      tags: [change-requests]
      summary: Use Claude to generate the actual file changes from the distilled spec
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patch generated and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /change-requests/{id}/request-publish:
    post:
      operationId: requestChangePublish
      tags: [change-requests]
      summary: Client approves the preview and asks the operator to publish
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked awaiting deploy and operator notified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /change-requests/{id}/mark-deployed:
    post:
      operationId: markChangeDeployed
      tags: [change-requests]
      summary: Operator confirms the change is live in production
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked deployed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /change-requests/{id}/rollback:
    post:
      operationId: rollbackChangeRequest
      tags: [change-requests]
      summary: Roll back a deployed change request to its snapshot
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rollback initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  # ─── Consulting packages ───────────────────────────────────────────────────

  /consulting/packages:
    get:
      operationId: listConsultingPackages
      tags: [consulting]
      summary: List consulting hour packages (3 tiers)
      responses:
        "200":
          description: Consulting packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultingPackageList"

  /consulting/bookings:
    get:
      operationId: listMyConsultingBookings
      tags: [consulting]
      summary: List my consulting bookings
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultingBookingList"

  /consulting/checkout:
    post:
      operationId: createConsultingCheckout
      tags: [consulting]
      summary: Create Stripe Checkout for a consulting package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsultingCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  # ─── Public checkout (no auth) ─────────────────────────────────────────────

  /checkout/build:
    post:
      operationId: createBuildCheckout
      tags: [checkout]
      summary: Start a public Stripe Checkout for the Premium Build deposit (no auth)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "503":
          description: Stripe is not configured

  /checkout/retainer:
    post:
      operationId: createRetainerCheckout
      tags: [checkout]
      summary: Start a public Stripe Checkout for the monthly retainer subscription (no auth)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "503":
          description: Stripe is not configured

  /checkout/portal:
    post:
      operationId: createPortalCheckout
      tags: [checkout]
      summary: Start a Stripe Checkout for the $500/mo Portal Access subscription (auth required)
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "401":
          description: Not signed in
        "503":
          description: Stripe is not configured

  # ─── Storage (object uploads) ──────────────────────────────────────────────

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for direct file upload to object storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  # ─── Public lead capture ───────────────────────────────────────────────────

  /leads:
    post:
      operationId: submitLead
      tags: [leads]
      summary: Submit a lead from a public contact form (no auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitLeadBody"
      responses:
        "200":
          description: Lead accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitLeadResponse"
        "400":
          description: Invalid input
        "429":
          description: Too many requests

  # ─── Admin ─────────────────────────────────────────────────────────────────

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/clients:
    get:
      operationId: listClients
      tags: [admin]
      summary: List all clients (admin only)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: All clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"

  /admin/clients/invite:
    post:
      operationId: inviteClient
      tags: [admin]
      summary: Invite a new client by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteClientBody"
      responses:
        "200":
          description: Invite sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"

  /admin/clients/{id}:
    get:
      operationId: getClientById
      tags: [admin]
      summary: Get a client by id (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [admin]
      summary: Delete a client (admin only). Hard-deletes invited rows with no history; soft-suspends clients with related records.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteClientResponse"

  /admin/clients/{id}/resend-invite:
    post:
      operationId: resendClientInvite
      tags: [admin]
      summary: Regenerate the invite token for a client and resend the invite email
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"

  /admin/clients/{id}/balance:
    patch:
      operationId: adjustClientBalance
      tags: [admin]
      summary: Manually adjust a client token balance
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustBalanceBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /admin/projects:
    get:
      operationId: listAllProjects
      tags: [admin]
      summary: List all client projects (admin only)
      responses:
        "200":
          description: All projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"

  /projects/{id}/heartbeat-token:
    post:
      operationId: rotateProjectHeartbeatToken
      tags: [projects]
      summary: Rotate the heartbeat token (owner only)
      description: Generates a fresh heartbeat token, invalidating the old one.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateHeartbeatTokenResponse"

  /admin/projects/{id}/owner:
    patch:
      operationId: reassignProjectOwner
      tags: [admin]
      summary: Reassign a project to a different client (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignProjectOwnerBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /admin/github/repos:
    get:
      operationId: listAdminGithubRepos
      tags: [admin]
      summary: List GitHub repos accessible to the connected GH account (admin only)
      description: |
        Surfaces every repo owned (or co-administered) by the GitHub account
        connected via the Replit GitHub integration, alongside whether each one
        has already been imported as a Machinedog project. Used by the admin
        All Projects page to populate one-click "Import" cards.
      responses:
        "200":
          description: GitHub repos for the connected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminGithubReposResponse"

  /admin/projects/import-github:
    post:
      operationId: importGithubProject
      tags: [admin]
      summary: Create a Machinedog project from a GitHub repo (admin only)
      description: |
        Creates a new project owned by the calling admin's client record, with
        githubOwner / githubRepo / githubDefaultBranch pre-populated. Admin can
        then reassign owner or attach collaborators via the existing controls.
        Returns 409 if a project with that owner/repo already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportGithubProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          description: A project for this repo already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Project secrets ───────────────────────────────────────────────────────

  /projects/{id}/secrets:
    get:
      operationId: listProjectSecrets
      tags: [projects]
      summary: List a project's secrets (owner only). Values are never returned.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Secrets for this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSecretList"
    post:
      operationId: createProjectSecret
      tags: [projects]
      summary: Create a project secret (owner only).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectSecretBody"
      responses:
        "201":
          description: Created secret (no plaintext returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSecret"

  /projects/{id}/secrets/{secretId}:
    patch:
      operationId: updateProjectSecret
      tags: [projects]
      summary: Update the value of an existing secret (owner only).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: secretId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectSecretBody"
      responses:
        "200":
          description: Updated secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSecret"
    delete:
      operationId: deleteProjectSecret
      tags: [projects]
      summary: Delete a secret (owner only).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: secretId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/secrets/{secretId}/rotate:
    post:
      operationId: rotateProjectSecret
      tags: [projects]
      summary: Rotate a secret with a new value (owner only). Bumps the version.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: secretId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectSecretBody"
      responses:
        "200":
          description: Rotated secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSecret"

  # ─── Audit log ─────────────────────────────────────────────────────────────

  /projects/{id}/audit:
    get:
      operationId: listProjectAudit
      tags: [projects]
      summary: List audit events scoped to this project.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"

  /admin/audit:
    get:
      operationId: listAdminAudit
      tags: [admin]
      summary: List all audit events with filters (admin only).
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: organizationId
          schema:
            type: integer
        - in: query
          name: projectId
          schema:
            type: integer
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"

  # ─── Build jobs & deployments ──────────────────────────────────────────────

  /projects/{id}/builds:
    get:
      operationId: listProjectBuilds
      tags: [projects]
      summary: List build jobs for this project, newest first.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Build jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildJobList"
    post:
      operationId: triggerProjectBuild
      tags: [projects]
      summary: Owner-only — trigger a new build/deploy via the project's host adapter.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerBuildBody"
      responses:
        "201":
          description: Build queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildJobResponse"

  /projects/{id}/deployments:
    get:
      operationId: listProjectDeployments
      tags: [projects]
      summary: List deployment history for this project.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Deployments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentList"

  /projects/{id}/hosting/credentials:
    post:
      operationId: setProjectHostingCredentials
      tags: [projects]
      summary: Owner-only — store host provider credentials (API token + webhook secret) on the project.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [vercel, render]
                apiToken:
                  type: string
                  minLength: 1
                webhookSecret:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Credentials stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  storedNames:
                    type: array
                    items:
                      type: string
                required: [ok, storedNames]

  /projects/{id}/hosting/test:
    post:
      operationId: testProjectHosting
      tags: [projects]
      summary: Owner-only — test the configured host provider's credentials.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostingTestResult"

  /admin/builds:
    get:
      operationId: listAdminBuilds
      tags: [admin]
      summary: All build jobs across orgs (admin only) with filters.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: organizationId
          schema:
            type: integer
        - in: query
          name: projectId
          schema:
            type: integer
        - in: query
          name: provider
          schema:
            type: string
            enum: [replit, vercel, render]
        - in: query
          name: status
          schema:
            type: string
            enum: [queued, running, succeeded, failed, canceled]
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Build jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBuildJobList"

  /admin/deployments:
    get:
      operationId: listAdminDeployments
      tags: [admin]
      summary: All deployments across orgs (admin only) with filters.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: organizationId
          schema:
            type: integer
        - in: query
          name: projectId
          schema:
            type: integer
        - in: query
          name: provider
          schema:
            type: string
            enum: [replit, vercel, render]
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, building, live, failed, canceled, rolled_back]
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Deployments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeploymentList"

  /admin/orders:
    get:
      operationId: listAllBuildOrders
      tags: [admin]
      summary: List paid build deposits and retainer subscriptions (admin only)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: All build orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildOrderList"

# ─── Schemas ───────────────────────────────────────────────────────────────────

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        tokenBalance:
          type: ["integer", "null"]
      required: [error]

    Client:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: ["string", "null"]
        email:
          type: string
        tokenBalance:
          type: integer
        totalTokensUsed:
          type: integer
        isAdmin:
          type: boolean
        stripeCustomerId:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, suspended, invited]
        portalSubscriptionStatus:
          type: string
          enum: [none, trialing, active, past_due, canceled, incomplete]
        portalCurrentPeriodEnd:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        # The organization the client belongs to. Optional because legacy
        # clients may not yet have a backfilled organization row. The
        # frontend uses `organization.planType` to gate plan-restricted
        # surfaces (e.g. healthcare templates).
        organization:
          type: ["object", "null"]
          properties:
            id:
              type: string
            name:
              type: string
            planType:
              type: string
              enum: [free, starter, pro, healthcare, enterprise]
          required: [id, name, planType]
      required: [id, email, tokenBalance, totalTokensUsed, isAdmin, status, portalSubscriptionStatus, createdAt]

    ClientList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        total:
          type: integer
      required: [data, total]

    PromptSession:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        projectId:
          type: ["integer", "null"]
        prompt:
          type: string
        output:
          type: string
        tokensUsed:
          type: integer
        model:
          type: string
        isPublished:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, clientId, prompt, output, tokensUsed, model, isPublished, createdAt]

    PublishPromptBody:
      type: object
      properties:
        published:
          type: boolean
          default: true

    PromptSessionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PromptSession"
        total:
          type: integer
      required: [data, total]

    SubmitPromptBody:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
      required: [prompt]

    TokenBundle:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        tokens:
          type: integer
        priceUsd:
          type: number
        stripePriceId:
          type: ["string", "null"]
        popular:
          type: boolean
      required: [key, name, tokens, priceUsd, popular]

    TokenBundleList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenBundle"
      required: [data]

    TokenPurchase:
      type: object
      properties:
        id:
          type: integer
        bundleKey:
          type: string
        tokensAdded:
          type: integer
        amountCents:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, bundleKey, tokensAdded, amountCents, status, createdAt]

    TokenPurchaseList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenPurchase"
      required: [data]

    CreateTokenCheckoutBody:
      type: object
      properties:
        bundleKey:
          type: string
      required: [bundleKey]

    CheckoutResponse:
      type: object
      properties:
        url:
          type: string
      required: [url]

    Project:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        title:
          type: string
        description:
          type: string
        summary:
          type: string
        liveUrl:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, active, completed, archived]
        projectType:
          type: string
          enum: [web_app, mobile_app, api, internal_tool, healthcare_template, other]
        framework:
          type: string
        templateSlug:
          type: ["string", "null"]
        healthcareMode:
          type: boolean
        phiAllowed:
          type: boolean
        baaStatus:
          type: string
          enum: [not_required, required, pending, active, expired]
        workspaceProvider:
          type: string
          enum: [database, replit, external]
        workspaceStatus:
          type: string
          enum: [idle, starting, running, stopping, error]
        workspaceUrl:
          type: ["string", "null"]
        lastStartedAt:
          type: ["string", "null"]
          format: date-time
        lastStoppedAt:
          type: ["string", "null"]
          format: date-time
        consultingBookingId:
          type: ["integer", "null"]
        githubOwner:
          type: ["string", "null"]
        githubRepo:
          type: ["string", "null"]
        githubDefaultBranch:
          type: string
        previewUrlTemplate:
          type: ["string", "null"]
        productionUrl:
          type: ["string", "null"]
        operatorEmail:
          type: ["string", "null"]
        # Per-project token used by the heartbeat snippet installed in the client
        # app to auto-report its current Replit dev URL. Returned to owners only.
        heartbeatToken:
          type: ["string", "null"]
        # ISO timestamp of the last heartbeat received. null = snippet has never
        # checked in (UI shows "not connected").
        heartbeatAt:
          type: ["string", "null"]
          format: date-time
        hostingProvider:
          type: string
          enum: [replit, vercel, render]
        hostingProjectId:
          type: ["string", "null"]
        hostingCredentialsRef:
          type: ["string", "null"]
        viewerRole:
          type: string
          enum: [owner, collaborator]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, clientId, title, description, summary, status, projectType, framework, healthcareMode, phiAllowed, baaStatus, workspaceProvider, workspaceStatus, githubDefaultBranch, hostingProvider, viewerRole, createdAt, updatedAt]

    ProjectSecret:
      type: object
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        environment:
          type: string
          enum: [development, staging, production]
        valuePreview:
          type: string
        version:
          type: integer
        createdBy:
          type: ["string", "null"]
        updatedBy:
          type: ["string", "null"]
        createdByEmail:
          type: ["string", "null"]
        updatedByEmail:
          type: ["string", "null"]
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, organizationId, projectId, name, environment, valuePreview, version, createdAt, updatedAt]

    ProjectSecretList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSecret"
      required: [data]

    CreateProjectSecretBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        environment:
          type: string
          enum: [development, staging, production]
          default: development
        value:
          type: string
          minLength: 1
      required: [name, value]

    UpdateProjectSecretBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        environment:
          type: string
          enum: [development, staging, production]
        value:
          type: string
          minLength: 1

    AuditAction:
      type: string
      description: Canonical audit action identifier. Must stay in sync with the `audit_action` Postgres enum in lib/db/src/schema/audit-events.ts.
      enum:
        - signin
        - signin_failed
        - organization_created
        - member_invited
        - member_removed
        - project_created
        - project_updated
        - project_archived
        - file_created
        - file_updated
        - file_deleted
        - ai_prompt_submitted
        - ai_change_accepted
        - ai_change_rejected
        - phi_blocked
        - secret_created
        - secret_updated
        - secret_deleted
        - secret_rotated
        - github_connected
        - repo_imported
        - repo_pulled
        - repo_pushed
        - build_started
        - build_failed
        - build_succeeded
        - deployment_started
        - deployment_live
        - deployment_failed
        - tokens_purchased
        - tokens_used
        - tokens_granted
        - tokens_adjusted
        - checkout_created
        - subscription_changed
        - payment_failed
        - healthcare_mode_requested
        - healthcare_gating_blocked
        - insufficient_tokens
        - baa_status_updated
        - ai_provider_updated
        - ai_model_updated

    AuditEvent:
      type: object
      properties:
        id:
          type: integer
        organizationId:
          type: ["integer", "null"]
        projectId:
          type: ["integer", "null"]
        actorOrganizationId:
          type: ["integer", "null"]
        actorEmail:
          type: ["string", "null"]
        actorUserId:
          type: ["string", "null"]
        category:
          type: string
        action:
          $ref: "#/components/schemas/AuditAction"
        targetType:
          type: ["string", "null"]
        targetId:
          type: ["string", "null"]
        metadata:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required: [id, category, action, createdAt]

    AuditEventList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        total:
          type: integer
      required: [data, total]

    Template:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [general, healthcare]
        framework:
          type: string
        projectType:
          type: string
          enum: [web_app, mobile_app, api, internal_tool, healthcare_template, other]
        isHealthcare:
          type: boolean
        tokenCost:
          type: integer
        complianceNotes:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, slug, name, description, category, framework, projectType, isHealthcare, tokenCost, complianceNotes, createdAt]

    TemplateList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Template"
      required: [data]

    ProjectList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
      required: [data]

    CreateProjectBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        summary:
          type: string
        liveUrl:
          type: string
        coverImageUrl:
          type: string
        # When set, the new project is bootstrapped from this template's
        # starterFiles. The server validates plan tier for healthcare
        # templates and copies starter files into project_files. Mutually
        # exclusive with githubOwner/githubRepo (which trigger import).
        templateSlug:
          type: ["string", "null"]
        # When set, the project is created with these GitHub fields and the
        # admin /admin/projects/import-github flow is bypassed. Used by the
        # 3-step wizard when origin == "github".
        githubOwner:
          type: ["string", "null"]
        githubRepo:
