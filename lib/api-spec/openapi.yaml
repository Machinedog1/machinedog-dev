openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Machinedog Client Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: prompts
    description: AI prompt submissions
  - name: tokens
    description: Token balance and purchases
  - name: projects
    description: Client projects
  - name: consulting
    description: Consulting packages and bookings
  - name: admin
    description: Admin operations
  - name: leads
    description: Public lead capture (e.g. pricing-page contact form)
  - name: checkout
    description: Public Stripe Checkout entry points (no auth)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Client self-service ───────────────────────────────────────────────────

  /clients/me:
    get:
      operationId: getMe
      tags: [clients]
      summary: Get my client profile
      responses:
        "200":
          description: Client profile with token balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          description: Unauthorized

  # ─── Prompts ───────────────────────────────────────────────────────────────

  /prompts:
    get:
      operationId: listMyPrompts
      tags: [prompts]
      summary: List my prompt sessions
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of prompt sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSessionList"
    post:
      operationId: submitPrompt
      tags: [prompts]
      summary: Submit a prompt (deducts tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPromptBody"
      responses:
        "200":
          description: Prompt result with token usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSession"
        "402":
          description: Insufficient token balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /prompts/{id}:
    get:
      operationId: getPrompt
      tags: [prompts]
      summary: Get a specific prompt session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prompt session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSession"
        "404":
          description: Not found

  # ─── Tokens ────────────────────────────────────────────────────────────────

  /tokens/bundles:
    get:
      operationId: listTokenBundles
      tags: [tokens]
      summary: List available token bundles for purchase
      responses:
        "200":
          description: Token bundles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBundleList"

  /tokens/purchases:
    get:
      operationId: listMyTokenPurchases
      tags: [tokens]
      summary: List my token purchase history
      responses:
        "200":
          description: Purchase history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPurchaseList"

  /tokens/checkout:
    post:
      operationId: createTokenCheckout
      tags: [tokens]
      summary: Create a Stripe Checkout session for token bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  # ─── Projects ──────────────────────────────────────────────────────────────

  /projects:
    get:
      operationId: listMyProjects
      tags: [projects]
      summary: List my projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  # ─── Consulting packages ───────────────────────────────────────────────────

  /consulting/packages:
    get:
      operationId: listConsultingPackages
      tags: [consulting]
      summary: List consulting hour packages (3 tiers)
      responses:
        "200":
          description: Consulting packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultingPackageList"

  /consulting/bookings:
    get:
      operationId: listMyConsultingBookings
      tags: [consulting]
      summary: List my consulting bookings
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultingBookingList"

  /consulting/checkout:
    post:
      operationId: createConsultingCheckout
      tags: [consulting]
      summary: Create Stripe Checkout for a consulting package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsultingCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  # ─── Public checkout (no auth) ─────────────────────────────────────────────

  /checkout/build:
    post:
      operationId: createBuildCheckout
      tags: [checkout]
      summary: Start a public Stripe Checkout for the Premium Build deposit (no auth)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "503":
          description: Stripe is not configured

  /checkout/retainer:
    post:
      operationId: createRetainerCheckout
      tags: [checkout]
      summary: Start a public Stripe Checkout for the monthly retainer subscription (no auth)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "503":
          description: Stripe is not configured

  # ─── Public lead capture ───────────────────────────────────────────────────

  /leads:
    post:
      operationId: submitLead
      tags: [leads]
      summary: Submit a lead from a public contact form (no auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitLeadBody"
      responses:
        "200":
          description: Lead accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitLeadResponse"
        "400":
          description: Invalid input
        "429":
          description: Too many requests

  # ─── Admin ─────────────────────────────────────────────────────────────────

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/clients:
    get:
      operationId: listClients
      tags: [admin]
      summary: List all clients (admin only)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: All clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"

  /admin/clients/invite:
    post:
      operationId: inviteClient
      tags: [admin]
      summary: Invite a new client by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteClientBody"
      responses:
        "200":
          description: Invite sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"

  /admin/clients/{id}:
    get:
      operationId: getClientById
      tags: [admin]
      summary: Get a client by id (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /admin/clients/{id}/balance:
    patch:
      operationId: adjustClientBalance
      tags: [admin]
      summary: Manually adjust a client token balance
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustBalanceBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /admin/projects:
    get:
      operationId: listAllProjects
      tags: [admin]
      summary: List all client projects (admin only)
      responses:
        "200":
          description: All projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"

  /admin/orders:
    get:
      operationId: listAllBuildOrders
      tags: [admin]
      summary: List paid build deposits and retainer subscriptions (admin only)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: All build orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildOrderList"

# ─── Schemas ───────────────────────────────────────────────────────────────────

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        tokenBalance:
          type: ["integer", "null"]
      required: [error]

    Client:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        email:
          type: string
        tokenBalance:
          type: integer
        totalTokensUsed:
          type: integer
        isAdmin:
          type: boolean
        stripeCustomerId:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, suspended, invited]
        createdAt:
          type: string
          format: date-time
      required: [id, userId, email, tokenBalance, totalTokensUsed, isAdmin, status, createdAt]

    ClientList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        total:
          type: integer
      required: [data, total]

    PromptSession:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        prompt:
          type: string
        output:
          type: string
        tokensUsed:
          type: integer
        model:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, clientId, prompt, output, tokensUsed, model, createdAt]

    PromptSessionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PromptSession"
        total:
          type: integer
      required: [data, total]

    SubmitPromptBody:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
      required: [prompt]

    TokenBundle:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        tokens:
          type: integer
        priceUsd:
          type: number
        stripePriceId:
          type: ["string", "null"]
        popular:
          type: boolean
      required: [key, name, tokens, priceUsd, popular]

    TokenBundleList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenBundle"
      required: [data]

    TokenPurchase:
      type: object
      properties:
        id:
          type: integer
        bundleKey:
          type: string
        tokensAdded:
          type: integer
        amountCents:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, bundleKey, tokensAdded, amountCents, status, createdAt]

    TokenPurchaseList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenPurchase"
      required: [data]

    CreateTokenCheckoutBody:
      type: object
      properties:
        bundleKey:
          type: string
      required: [bundleKey]

    CheckoutResponse:
      type: object
      properties:
        url:
          type: string
      required: [url]

    Project:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, active, completed, archived]
        consultingBookingId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, clientId, title, description, status, createdAt, updatedAt]

    ProjectList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
      required: [data]

    CreateProjectBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
      required: [title, description]

    UpdateProjectBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, active, completed, archived]

    ConsultingPackage:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        hours:
          type: integer
        priceUsd:
          type: number
        description:
          type: string
        stripePriceId:
          type: ["string", "null"]
        popular:
          type: boolean
      required: [key, name, hours, priceUsd, description, popular]

    ConsultingPackageList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConsultingPackage"
      required: [data]

    ConsultingBooking:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        packageKey:
          type: string
        hoursTotal:
          type: integer
        hoursUsed:
          type: integer
        status:
          type: string
          enum: [pending, active, completed]
        stripeSessionId:
          type: ["string", "null"]
        amountCents:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, clientId, packageKey, hoursTotal, hoursUsed, status, amountCents, createdAt]

    ConsultingBookingList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConsultingBooking"
      required: [data]

    CreateConsultingCheckoutBody:
      type: object
      properties:
        packageKey:
          type: string
      required: [packageKey]

    AdminStats:
      type: object
      properties:
        totalClients:
          type: integer
        activeClients:
          type: integer
        totalTokensUsed:
          type: integer
        totalTokensPurchased:
          type: integer
        totalRevenueCents:
          type: integer
        totalPrompts:
          type: integer
        totalProjects:
          type: integer
        totalConsultingHoursBooked:
          type: integer
        totalPaidBuilds:
          type: integer
          description: Number of build_orders with kind=build that have completed payment
        activeRetainers:
          type: integer
          description: Number of build_orders with kind=retainer in active status
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - totalClients
        - activeClients
        - totalTokensUsed
        - totalTokensPurchased
        - totalRevenueCents
        - totalPrompts
        - totalProjects
        - totalConsultingHoursBooked
        - totalPaidBuilds
        - activeRetainers
        - recentActivity

    BuildOrder:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [build, retainer]
        email:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        amountCents:
          type: integer
        currency:
          type: string
        source:
          type: string
        status:
          type: string
          enum: [pending, completed, active, cancelled]
        stripeSessionId:
          type: string
        stripeCustomerId:
          type: ["string", "null"]
        stripeSubscriptionId:
          type: ["string", "null"]
        stripePaymentIntentId:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - amountCents
        - currency
        - source
        - status
        - stripeSessionId
        - createdAt
        - updatedAt

    BuildOrderList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BuildOrder"
        total:
          type: integer
      required: [data, total]

    ActivityItem:
      type: object
      properties:
        type:
          type: string
        description:
          type: string
        clientEmail:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [type, description, createdAt]

    InviteClientBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    InviteResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    AdjustBalanceBody:
      type: object
      properties:
        delta:
          type: integer
          description: Positive to add tokens, negative to deduct
        reason:
          type: string
      required: [delta]

    PublicCheckoutBody:
      type: object
      properties:
        source:
          type: ["string", "null"]
          maxLength: 100
          description: Where the visitor came from (e.g. "pricing-page")

    SubmitLeadBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        company:
          type: ["string", "null"]
          maxLength: 200
        notes:
          type: ["string", "null"]
          maxLength: 5000
        source:
          type: ["string", "null"]
          maxLength: 100
          description: Where the lead originated (e.g. "pricing-page")
        website:
          type: ["string", "null"]
          description: Honeypot field — must be empty for real submissions
      required: [name, email]

    SubmitLeadResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: integer
      required: [success]
