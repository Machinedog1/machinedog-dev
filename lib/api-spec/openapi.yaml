      type: object
      properties:
        ok:
          type: boolean
        projectId:
          type: integer
        receivedAt:
          type: string
          format: date-time
        # Set when this heartbeat caused a change request to auto-flip to
        # `deployed`. Null when no auto-flip happened (most heartbeats).
        autoMarkedDeployedChangeRequestId:
          type: ["integer", "null"]
      required: [ok, projectId, receivedAt]

