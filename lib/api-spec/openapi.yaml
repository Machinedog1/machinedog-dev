            - patched
            - snapshot_taken
            - pr_open
            - awaiting_publish
            - merged
            - awaiting_deploy
            - deployed
            - rolled_back
            - failed
        title:
          type: string
        rawRequest:
          type: string
        distilledSpec:
          description: Structured spec emitted by Claude. Shape depends on the model output.
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        patchSummary:
          type: ["string", "null"]
        patchFiles:
          description: List of file changes Claude proposed.
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: "null"
        githubBranch:
          type: ["string", "null"]
        githubPrNumber:
          type: ["integer", "null"]
        githubPrUrl:
          type: ["string", "null"]
        snapshotTag:
          type: ["string", "null"]
        snapshotSha:
          type: ["string", "null"]
        previewUrl:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        requestedPublishAt:
          type: ["string", "null"]
          format: date-time
        mergedAt:
          type: ["string", "null"]
          format: date-time
        deployedAt:
          type: ["string", "null"]
          format: date-time
        rolledBackAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
