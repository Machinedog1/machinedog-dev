      required: [heartbeatToken]

    ProjectProdHeartbeatBody:
      type: object
      properties:
        token:
          type: string
          minLength: 16
        # Server start time on the prod box, in epoch milliseconds
        # (Date.now() - process.uptime()*1000 is fine). Used together with
        # releaseMarker to deduplicate Autoscale heartbeats from the same
        # instance and to compare against the merge timestamp.
        bootedAt:
          type: integer
          format: int64
        # Optional production URL the snippet is running on (e.g.
        # https://ctrlfarm.replit.app). When provided and the project has no
        # productionUrl set, we save it so the operator UI can link to it.
        prodUrl:
          type: ["string", "null"]
        # Optional Replit-injected identifier (REPL_DEPLOYMENT_ID,
        # SOURCE_VERSION, etc.). Combined with bootedAt to form the
        # deduplication marker. Truly unique per actual deploy when present.
        releaseMarker:
          type: ["string", "null"]
      required: [token, bootedAt]

