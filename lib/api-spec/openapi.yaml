openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Machinedog Client Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: prompts
    description: AI prompt submissions
  - name: tokens
    description: Token balance and purchases
  - name: projects
    description: Client projects
  - name: consulting
    description: Consulting packages and bookings
  - name: admin
    description: Admin operations
  - name: leads
    description: Public lead capture (e.g. pricing-page contact form)
  - name: checkout
    description: Public Stripe Checkout entry points (no auth)
  - name: storage
    description: Object storage upload and serving endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Client self-service ───────────────────────────────────────────────────

  /clients/me:
    get:
      operationId: getMe
      tags: [clients]
      summary: Get my client profile
      responses:
        "200":
          description: Client profile with token balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          description: Unauthorized

  # ─── Prompts ───────────────────────────────────────────────────────────────

  /prompts:
    get:
      operationId: listMyPrompts
      tags: [prompts]
      summary: List my prompt sessions
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of prompt sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSessionList"
    post:
      operationId: submitPrompt
      tags: [prompts]
      summary: Submit a prompt (deducts tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPromptBody"
      responses:
        "200":
          description: Prompt result with token usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSession"
        "402":
          description: Insufficient token balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /prompts/{id}:
    get:
      operationId: getPrompt
      tags: [prompts]
      summary: Get a specific prompt session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prompt session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSession"
        "404":
          description: Not found

  /prompts/{id}/publish:
    post:
      operationId: publishPrompt
      tags: [prompts]
      summary: Mark a prompt session as published (or unpublished)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPromptBody"
      responses:
        "200":
          description: Updated prompt session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSession"
        "404":
          description: Not found

  # ─── Tokens ────────────────────────────────────────────────────────────────

  /tokens/bundles:
    get:
      operationId: listTokenBundles
      tags: [tokens]
      summary: List available token bundles for purchase
      responses:
        "200":
          description: Token bundles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBundleList"

  /tokens/purchases:
    get:
      operationId: listMyTokenPurchases
      tags: [tokens]
      summary: List my token purchase history
      responses:
        "200":
          description: Purchase history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPurchaseList"

  /tokens/checkout:
    post:
      operationId: createTokenCheckout
      tags: [tokens]
      summary: Create a Stripe Checkout session for token bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  # ─── Projects ──────────────────────────────────────────────────────────────

  /projects:
    get:
      operationId: listMyProjects
      tags: [projects]
      summary: List my projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/heartbeat:
    post:
      operationId: projectHeartbeat
      tags: [projects]
      summary: Auto-report a Replit dev URL from a client app
      description: >-
        Public endpoint hit by the heartbeat snippet installed in the client
        app. Auth is by per-project token (in the body) — no session required,
        so it works from anywhere the snippet is loaded. Updates the project's
        liveUrl and heartbeatAt timestamp. Idempotent.
      security: []  # public; auth is the token in the body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectHeartbeatBody"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHeartbeatResponse"
        "401":
          description: Unknown or rotated token
        "400":
          description: Invalid body

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}/members:
    get:
      operationId: listProjectMembers
      tags: [projects]
      summary: List members on a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberList"
    post:
      operationId: inviteProjectMember
      tags: [projects]
      summary: Invite a client to a project by email
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteProjectMemberBody"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"

  /projects/{id}/members/{memberId}:
    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: Remove a member from a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: memberId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Member removed

  /projects/{id}/comments:
    get:
      operationId: listProjectComments
      tags: [projects]
      summary: List comments on a project (owner or member)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCommentList"
    post:
      operationId: addProjectComment
      tags: [projects]
      summary: Post a comment on a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectCommentBody"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectComment"

  /projects/{id}/comments/{commentId}:
    delete:
      operationId: deleteProjectComment
      tags: [projects]
      summary: Delete a comment (author or project owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: commentId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted

  /projects/{id}/prompts:
    get:
      operationId: listProjectPrompts
      tags: [projects]
      summary: List prompt sessions scoped to this project (shared across members)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSessionList"
    post:
      operationId: submitProjectPrompt
      tags: [projects]
      summary: Submit a prompt scoped to this project (charges submitter tokens)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPromptBody"
      responses:
        "200":
          description: Prompt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSession"

  /projects/{id}/files:
    get:
      operationId: listProjectFiles
      tags: [projects]
      summary: List files attached to this project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileList"
    post:
      operationId: addProjectFile
      tags: [projects]
      summary: Record an uploaded file's metadata against a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectFileBody"
      responses:
        "201":
          description: Created file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"

  /projects/{id}/files/{fileId}:
    delete:
      operationId: deleteProjectFile
      tags: [projects]
      summary: Remove a file from a project (uploader or project owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: fileId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: File removed

  # ─── Change requests ───────────────────────────────────────────────────────

  /projects/{id}/change-requests:
    get:
      operationId: listProjectChangeRequests
      tags: [change-requests]
      summary: List change requests for a project (owner or member)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Change requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestList"
    post:
      operationId: createChangeRequest
      tags: [change-requests]
      summary: Submit a new plain-English change request against a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /projects/{id}/change-requests/agent:
    post:
      operationId: submitAgentChangeRequest
      tags: [change-requests]
      summary: Submit a request and immediately kick off the full agent pipeline (distill + patch) in the background
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeRequestBody"
      responses:
        "201":
          description: Created and pipeline started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /projects/{id}/agent-thread:
    get:
      operationId: getProjectAgentThread
      tags: [change-requests]
      summary: Get all change requests for a project plus their events, ordered for chat-style rendering
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unified thread payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentThreadResponse"

  /change-requests/{id}:
    get:
      operationId: getChangeRequest
      tags: [change-requests]
      summary: Get a change request with its event timeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Change request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestDetail"

  /change-requests/{id}/distill:
    post:
      operationId: distillChangeRequest
      tags: [change-requests]
      summary: Use Claude to turn the raw request into a structured spec
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Distilled spec attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /change-requests/{id}/generate-patch:
    post:
      operationId: generateChangePatch
      tags: [change-requests]
      summary: Use Claude to generate the actual file changes from the distilled spec
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patch generated and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /change-requests/{id}/request-publish:
    post:
      operationId: requestChangePublish
      tags: [change-requests]
      summary: Client approves the preview and asks the operator to publish
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked awaiting deploy and operator notified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /change-requests/{id}/mark-deployed:
    post:
      operationId: markChangeDeployed
      tags: [change-requests]
      summary: Operator confirms the change is live in production
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked deployed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  /change-requests/{id}/rollback:
    post:
      operationId: rollbackChangeRequest
      tags: [change-requests]
      summary: Roll back a deployed change request to its snapshot
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rollback initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"

  # ─── Consulting packages ───────────────────────────────────────────────────

  /consulting/packages:
    get:
      operationId: listConsultingPackages
      tags: [consulting]
      summary: List consulting hour packages (3 tiers)
      responses:
        "200":
          description: Consulting packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultingPackageList"

  /consulting/bookings:
    get:
      operationId: listMyConsultingBookings
      tags: [consulting]
      summary: List my consulting bookings
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultingBookingList"

  /consulting/checkout:
    post:
      operationId: createConsultingCheckout
      tags: [consulting]
      summary: Create Stripe Checkout for a consulting package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsultingCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  # ─── Public checkout (no auth) ─────────────────────────────────────────────

  /checkout/build:
    post:
      operationId: createBuildCheckout
      tags: [checkout]
      summary: Start a public Stripe Checkout for the Premium Build deposit (no auth)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "503":
          description: Stripe is not configured

  /checkout/retainer:
    post:
      operationId: createRetainerCheckout
      tags: [checkout]
      summary: Start a public Stripe Checkout for the monthly retainer subscription (no auth)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutBody"
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "503":
          description: Stripe is not configured

  /checkout/portal:
    post:
      operationId: createPortalCheckout
      tags: [checkout]
      summary: Start a Stripe Checkout for the $500/mo Portal Access subscription (auth required)
      responses:
        "200":
          description: Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "401":
          description: Not signed in
        "503":
          description: Stripe is not configured

  # ─── Storage (object uploads) ──────────────────────────────────────────────

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for direct file upload to object storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  # ─── Public lead capture ───────────────────────────────────────────────────

  /leads:
    post:
      operationId: submitLead
      tags: [leads]
      summary: Submit a lead from a public contact form (no auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitLeadBody"
      responses:
        "200":
          description: Lead accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitLeadResponse"
        "400":
          description: Invalid input
        "429":
          description: Too many requests

  # ─── Admin ─────────────────────────────────────────────────────────────────

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/clients:
    get:
      operationId: listClients
      tags: [admin]
      summary: List all clients (admin only)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: All clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"

  /admin/clients/invite:
    post:
      operationId: inviteClient
      tags: [admin]
      summary: Invite a new client by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteClientBody"
      responses:
        "200":
          description: Invite sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"

  /admin/clients/{id}:
    get:
      operationId: getClientById
      tags: [admin]
      summary: Get a client by id (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [admin]
      summary: Delete a client (admin only). Hard-deletes invited rows with no history; soft-suspends clients with related records.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteClientResponse"

  /admin/clients/{id}/resend-invite:
    post:
      operationId: resendClientInvite
      tags: [admin]
      summary: Regenerate the invite token for a client and resend the invite email
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"

  /admin/clients/{id}/balance:
    patch:
      operationId: adjustClientBalance
      tags: [admin]
      summary: Manually adjust a client token balance
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustBalanceBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /admin/projects:
    get:
      operationId: listAllProjects
      tags: [admin]
      summary: List all client projects (admin only)
      responses:
        "200":
          description: All projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"

  /projects/{id}/heartbeat-token:
    post:
      operationId: rotateProjectHeartbeatToken
      tags: [projects]
      summary: Rotate the heartbeat token (owner only)
      description: Generates a fresh heartbeat token, invalidating the old one.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateHeartbeatTokenResponse"

  /admin/projects/{id}/owner:
    patch:
      operationId: reassignProjectOwner
      tags: [admin]
      summary: Reassign a project to a different client (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignProjectOwnerBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /admin/github/repos:
    get:
      operationId: listAdminGithubRepos
      tags: [admin]
      summary: List GitHub repos accessible to the connected GH account (admin only)
      description: |
        Surfaces every repo owned (or co-administered) by the GitHub account
        connected via the Replit GitHub integration, alongside whether each one
        has already been imported as a Machinedog project. Used by the admin
        All Projects page to populate one-click "Import" cards.
      responses:
        "200":
          description: GitHub repos for the connected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminGithubReposResponse"

  /admin/projects/import-github:
    post:
      operationId: importGithubProject
      tags: [admin]
      summary: Create a Machinedog project from a GitHub repo (admin only)
      description: |
        Creates a new project owned by the calling admin's client record, with
        githubOwner / githubRepo / githubDefaultBranch pre-populated. Admin can
        then reassign owner or attach collaborators via the existing controls.
        Returns 409 if a project with that owner/repo already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportGithubProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          description: A project for this repo already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders:
    get:
      operationId: listAllBuildOrders
      tags: [admin]
      summary: List paid build deposits and retainer subscriptions (admin only)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: All build orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildOrderList"

